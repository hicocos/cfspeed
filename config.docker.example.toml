# Docker 中监听容器网卡；宿主机仍只映射到 127.0.0.1。
[service]
source_url = "https://ip.164746.xyz/ipTop.html"
interval_seconds = 21600 # DNS 同步：6 小时
source_interval_seconds = 21600 # IP 获取：6 小时；旧配置省略时继承 DNS 间隔
timeout_seconds = 15
attempts = 3
max_ips = 30
dry_run = true
state_dir = "/data"
host = "0.0.0.0"
port = 8788
# 添加目标请参照 config.example.toml。
