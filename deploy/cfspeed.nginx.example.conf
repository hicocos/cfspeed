# Dedicated cfspeed.example.com vhost. Does not alter other sites.
log_format cfspeed_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=cfspeed_edge:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cfspeed_login:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=cfspeed_connections:1m;
server {
    listen 80;
    listen [::]:80;
    server_name cfspeed.example.com;
    root /opt/cfspeed.example.com;
    access_log /www/wwwlogs/cfspeed.example.com.access.log cfspeed_safe;
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; try_files $uri =404; }
    location / { return 308 https://cfspeed.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cfspeed.example.com;
    ssl_certificate /etc/letsencrypt/live/cfspeed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cfspeed.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CFSPEED_TLS:1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /www/wwwlogs/cfspeed.example.com.access.log cfspeed_safe;
    error_log /www/wwwlogs/cfspeed.example.com.error.log warn;
    if ($host != cfspeed.example.com) { return 421; }
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn cfspeed_connections 12;
    limit_req zone=cfspeed_edge burst=50 nodelay;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 25s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host cfspeed.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    location = /api/auth/login {
        limit_req zone=cfspeed_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8788;
    }
    location / { proxy_pass http://127.0.0.1:8788; }
}
